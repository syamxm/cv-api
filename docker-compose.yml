version: "3.9"
services:
  db:
    image: postgres:16-alpine
    container_name: cv_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - cv_db_data:/var/lib/postgresql/data
      - ./sql/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    networks:
      - cv_network

  api:
    build: .
    container_name: cv_api
    restart: unless-stopped
    depends_on:
      - db
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      DB_HOST: db
      DB_PORT: 5432
      PORT: 3001
    networks:
      - cv_network
      - proxy-net

volumes:
  cv_db_data:

networks:
  cv_network:
    driver: bridge
  proxy-net:
    external: true
